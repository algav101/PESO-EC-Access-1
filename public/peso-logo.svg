<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c462" />
      <stop offset="50%" stop-color="#d49b28" />
      <stop offset="100%" stop-color="#aa7615" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Gold Rim -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#goldRim)" stroke-width="10" filter="url(#subtleShadow)" />
  <circle cx="100" cy="100" r="86" fill="#ffffff" stroke="#fce2a6" stroke-width="2" />
  
  <!-- Centered PESO Text -->
  <text 
    x="100" 
    y="124" 
    text-anchor="middle" 
    font-family="'Anton', 'Arial Black', 'Impact', 'Inter', sans-serif" 
    font-weight="900" 
    font-size="58" 
    fill="#0c3b6d" 
    letter-spacing="1.5"
  >
    PESO
  </text>
</svg>
